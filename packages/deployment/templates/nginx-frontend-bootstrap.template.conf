# {{envName}} — frontend dedicated-root bootstrap (HTTP + ACME)
# Install this before certbot. Re-generate with --ssl-ready after certs exist.
server {
  listen 80;
  server_name {{domain}};
  root {{staticRoot}};
  index index.html;
  client_max_body_size 50m;

  location ^~ /.well-known/acme-challenge/ {
    root {{acmeChallengeRoot}};
    allow all;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
