# production — dedicated-domain bootstrap (HTTP + ACME, certs not yet issued)
# Install this before running certbot. Re-generate with --ssl-ready after certs exist.
server {
  listen 80;
  server_name api.sushmapet.apps.mawsoftwares.in;

  client_max_body_size 50m;

  location ^~ /.well-known/acme-challenge/ {
    root /home/deploy/prod/sushmapet/acme-challenge;
    allow all;
  }

  location / {
    proxy_pass http://127.0.0.1:4003;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
