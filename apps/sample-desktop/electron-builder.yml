appId: com.mawsoftwares.foundation
productName: MAW Foundation
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - "!node_modules/**/*"
npmRebuild: false
# macOS: repairs the signature electron-builder leaves invalid when no signing identity is set (see the script).
afterSign: scripts/after-sign.cjs
publish:
  provider: generic
  url: ""
mac:
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.business
  hardenedRuntime: true
win:
  target:
    - nsis
  artifactName: "${productName}-${version}-setup.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  artifactName: "${productName}-${version}.${ext}"
  category: Office
