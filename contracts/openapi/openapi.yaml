  /api/v1/storage/attachments:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1attachments'
  /api/v1/storage/attachments/{id}:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1attachments~1{id}'
  /api/v1/storage/local/{token}:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1local~1{token}'

  # --- Jobs ---
  /api/v1/jobs:
    $ref: './jobs.yaml#/paths/~1api~1v1~1jobs'
  /api/v1/jobs/{id}:
    $ref: './jobs.yaml#/paths/~1api~1v1~1jobs~1{id}'

  # --- Reporting ---
  /reporting/definitions:
    $ref: './reporting.yaml#/paths/~1reporting~1definitions'
  /reporting/definitions/{name}/metadata:
    $ref: './reporting.yaml#/paths/~1reporting~1definitions~1{name}~1metadata'
  /reporting/preview:
    $ref: './reporting.yaml#/paths/~1reporting~1preview'
  /reporting/run:
    $ref: './reporting.yaml#/paths/~1reporting~1run'
  /reporting/save:
    $ref: './reporting.yaml#/paths/~1reporting~1save'
