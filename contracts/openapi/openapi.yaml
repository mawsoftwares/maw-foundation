  # --- Menus ---
  /api/v1/menus:
    $ref: './menus.yaml#/paths/~1api~1v1~1menus'
  /api/v1/menus/tree:
    $ref: './menus.yaml#/paths/~1api~1v1~1menus~1tree'
  /api/v1/menus/{id}:
    $ref: './menus.yaml#/paths/~1api~1v1~1menus~1{id}'
  /api/v1/menus/reorder:
    $ref: './menus.yaml#/paths/~1api~1v1~1menus~1reorder'

  # --- Files ---
  /files/upload:
    $ref: './files.yaml#/paths/~1files~1upload'
  /files:
    $ref: './files.yaml#/paths/~1files'
  /files/url/{key}:
    $ref: './files.yaml#/paths/~1files~1url~1{key}'
  /files/{key}:
    $ref: './files.yaml#/paths/~1files~1{key}'

  # --- Storage ---
  /api/v1/storage/providers:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1providers'
  /api/v1/storage/configurations:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1configurations'
  /api/v1/storage/configurations/{id}:
    $ref: './storage.yaml#/paths/~1api~1v1~1storage~1configurations~1{id}'
  /api/v1/storage/configurations/{id}/test:
