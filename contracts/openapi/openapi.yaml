  /api/v1/roles:
    $ref: './system.yaml#/paths/~1api~1v1~1roles'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (15-min TTL, HS256, JTI blacklisting)

    CsrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF double-submit token (required for unsafe methods in cookie mode)

  schemas:
    $ref: '../schemas/common.yaml#/components/schemas'
