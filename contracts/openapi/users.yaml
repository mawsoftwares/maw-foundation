paths:
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users with pagination
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '../schemas/common.yaml#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserResponse'
                      meta:
                        type: object
                        properties:
                          pagination:
                            $ref: '../schemas/common.yaml#/components/schemas/PaginationMeta'
        '401':
          $ref: 'auth.yaml#/components/responses/FlatError401'
        '403':
          description: Forbidden — requires Read_Users permission
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: 'auth.yaml#/components/responses/FlatError400'
        '409':
          $ref: 'auth.yaml#/components/responses/FlatError409'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: 'auth.yaml#/components/responses/FlatError404'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: 'auth.yaml#/components/responses/FlatError404'
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete a user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted
        '404':
          $ref: 'auth.yaml#/components/responses/FlatError404'

  /api/v1/users/{id}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      summary: Activate a user account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'

  /api/v1/users/{id}/deactivate:
    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user account
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas/common.yaml#/components/schemas/ApiSuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'

  /api/v1/users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: adminResetPassword
      summary: Admin-initiated password reset for a user
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Password reset initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true

components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    UserResponse:
      type: object
      required: [id, tenantId, email, role, accountStatus, emailVerified, mfaEnabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
        audience:
          type: string
        scopeId:
          type: string
          nullable: true
        accountStatus:
          $ref: '../schemas/common.yaml#/components/schemas/AccountStatus'
        emailVerified:
          type: boolean
        mfaEnabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
        name:
          type: string
        audience:
          type: string
        scopeId:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        audience:
          type: string
        scopeId:
          type: string
