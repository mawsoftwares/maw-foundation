# Manual publish of @mawsoftwares/* to GitHub Packages.
# Everyday versioning still uses .github/workflows/release.yml (changesets on main).
name: Publish MAW Packages

on:
  workflow_dispatch:

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write npmrc
        run: cp .npmrc.example .npmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@mawsoftwares'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Publish packages
        run: pnpm -r --filter './packages/**' --filter './adapters/**' publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
