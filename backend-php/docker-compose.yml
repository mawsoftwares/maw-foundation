services:
  app:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: maw_foundation
      DB_USERNAME: maw_app
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '9000:9000'

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/app/public
    ports:
      - '${PHP_PORT:-8080}:80'
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maw_foundation
      POSTGRES_USER: maw_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maw_app -d maw_foundation"]
      interval: 5s
      timeout: 3s
      retries: 5

  test:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - /app/vendor
    environment:
      APP_ENV: testing
      DB_HOST: db-test
      DB_PORT: "5432"
      DB_DATABASE: maw_foundation_test
      DB_USERNAME: maw_test
      DB_PASSWORD: test_password
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    depends_on:
      db-test:
        condition: service_healthy
    profiles:
      - test
    entrypoint: ["composer", "verify"]

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maw_foundation_test
      POSTGRES_USER: maw_test
      POSTGRES_PASSWORD: test_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maw_test -d maw_foundation_test"]
      interval: 3s
      timeout: 2s
      retries: 5
    profiles:
      - test

volumes:
  pgdata:
